<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Алтай — интерактивная карта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#123746;--muted:#64767e;--panel:#fff;--line:#d9e2e5;--bg:#f4f1ec;
  --kra:#7aa34a;--rep:#2d8cb2;--airport:#263c4b;--casino:#7e4b84;--place:#d17a36;--hotel:#b8860b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;z-index:500}
.sidebar h1{font-size:18px;font-weight:800;line-height:1.2}
.sub{font-size:12px;color:var(--muted);line-height:1.4}
.section{border-top:1px solid var(--line);padding-top:10px}
h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.checks{display:flex;flex-direction:column;gap:5px;font-size:13px}
.checks label{display:flex;align-items:center;gap:7px;cursor:pointer}
.checks input{width:15px;height:15px;accent-color:var(--ink)}
.route{background:#f5f8f8;border:1px solid #dce6e9;border-radius:14px;padding:11px}
.route label{display:block;font-size:11px;font-weight:700;margin:6px 0 4px}
select{width:100%;padding:8px 9px;border:1px solid #ccdadd;border-radius:9px;background:#fff;font-size:13px}
.btnrow{display:flex;gap:7px;margin-top:8px}
button,a.btn{border:0;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none}
.primary{background:var(--ink);color:#fff;flex:1}
.secondary{background:#e9f0f1;color:var(--ink)}
#result{font-size:12px;line-height:1.4;margin-top:8px}
.legend{display:grid;gap:5px;font-size:11px}
.legend-row{display:flex;align-items:center;gap:7px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block}
.map-area{position:relative;min-width:0}
#map{width:100%;height:100%}

/* Popup card */
.popup-card{position:absolute;top:12px;right:12px;width:300px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:18px;z-index:1000;display:none;max-height:calc(100vh - 40px);overflow-y:auto}
.popup-card.open{display:block}
.popup-card .close{position:absolute;top:8px;right:12px;background:#eef3f4;border:none;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.popup-card .ptype{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.popup-card .pname{font-size:17px;font-weight:800;margin-bottom:7px}
.popup-card .pregion,.popup-card .paddress{font-size:12px;color:var(--muted);margin-bottom:3px}
.popup-card .pbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.popup-card .pbtns button,.popup-card .pbtns a{font-size:11px;padding:7px 10px}

/* Leaflet custom labels */
.lbl-project{background:rgba(255,255,255,.94)!important;border:1.5px solid rgba(18,55,70,.15)!important;border-radius:8px!important;padding:3px 8px!important;font-size:12px!important;font-weight:700!important;color:var(--ink)!important;box-shadow:0 2px 8px rgba(0,0,0,.1)!important;white-space:nowrap!important}
.lbl-project::before{display:none!important}
.lbl-airport{background:rgba(255,255,255,.85)!important;border:1px solid rgba(18,55,70,.1)!important;border-radius:6px!important;padding:2px 6px!important;font-size:10px!important;font-weight:600!important;color:var(--airport)!important;box-shadow:0 1px 4px rgba(0,0,0,.06)!important;white-space:nowrap!important}
.lbl-airport::before{display:none!important}
.lbl-river{background:transparent!important;border:none!important;box-shadow:none!important;font-size:13px!important;font-weight:700!important;color:#2a7fbf!important;font-style:italic!important;letter-spacing:.4px!important;text-shadow:1px 1px 3px rgba(255,255,255,.95),-1px -1px 3px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.8)!important;white-space:nowrap!important}
.lbl-river::before{display:none!important}

.lbl-city{background:transparent!important;border:none!important;box-shadow:none!important;font-size:11px!important;font-weight:600!important;color:#333!important;text-shadow:1px 1px 2px rgba(255,255,255,.95),-1px -1px 2px rgba(255,255,255,.95)!important;white-space:nowrap!important}
.lbl-city::before{display:none!important}
.lbl-city-cap{background:transparent!important;border:none!important;box-shadow:none!important;font-size:14px!important;font-weight:800!important;color:#111!important;text-shadow:1px 1px 3px rgba(255,255,255,.95),-1px -1px 3px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.8)!important;white-space:nowrap!important}
.lbl-city-cap::before{display:none!important}


.toggle-all{width:100%;padding:7px 10px;font-size:11px;font-weight:700;background:#e9f0f1;border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;transition:background .15s}
.toggle-all:hover{background:#dce6e9}

@media(max-width:800px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{max-height:32vh;border-right:none;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Алтай · интерактивная карта</h1>
    <div class="sub">Инвестиционные проекты Алтайского края и Республики Алтай на живой карте.</div>

    <div class="section">
      <h2>Районы</h2>
      <div class="checks">
        <label><input type="checkbox" id="chk_rep" checked> Республика Алтай</label>
        <label><input type="checkbox" id="chk_kra" checked> Алтайский край</label>
      </div>
    </div>

    <div class="section">
      <h2>Админ. районы</h2>
      <div class="checks" id="districtList" style="max-height:200px;overflow-y:auto"></div>
    </div>

    <!-- Объекты — временно скрыты -->
    <div class="section" style="display:none">
      <h2>Объекты</h2>
      <div class="checks">
        <label><input type="checkbox" id="chk_projects" checked> Проекты</label>
        <label><input type="checkbox" id="chk_airports" checked> Аэропорты</label>
        <label><input type="checkbox" id="chk_casino" checked> Казино</label>
        <label><input type="checkbox" id="chk_places" checked> Важные места</label>
        <label><input type="checkbox" id="chk_hotels" checked> Отели</label>
      </div>
      <button class="toggle-all" id="toggleAll" style="margin-top:6px">Убрать все</button>
      <div class="checks" id="objList" style="margin-top:6px;max-height:180px;overflow-y:auto"></div>
    </div>

    <div class="section route">
      <h2>Маршрут</h2>
      <label for="from">Откуда</label>
      <select id="from"></select>
      <label for="to">Куда</label>
      <select id="to"></select>
      <div class="btnrow">
        <button class="primary" id="buildRoute">Построить</button>
        <button class="secondary" id="clearRoute">↺</button>
      </div>
      <div id="result"></div>
      <a class="btn secondary" id="yandex" href="#" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:7px;width:100%">Яндекс Карты ↗</a>
    </div>

    <div class="section">
      <h2>Легенда</h2>
      <div class="legend">
        <div class="legend-row"><span class="sw" style="background:var(--kra)"></span> Проект · Алтайский край</div>
        <div class="legend-row"><span class="sw" style="background:var(--rep)"></span> Проект · Республика Алтай</div>
        <div class="legend-row"><span class="sw" style="background:var(--airport)"></span> Аэропорт</div>
        <div class="legend-row"><span class="sw" style="background:var(--casino)"></span> Казино</div>
        <div class="legend-row"><span class="sw" style="background:var(--place)"></span> Важное место</div>
        <div class="legend-row"><span class="sw" style="background:var(--hotel)"></span> Отель</div>
        <div class="legend-row"><span class="sw" style="background:rgba(122,163,74,.2);border:2px solid var(--kra)"></span> Алтайский край</div>
        <div class="legend-row"><span class="sw" style="background:rgba(45,140,178,.2);border:2px solid var(--rep)"></span> Республика Алтай</div>
      </div>
    </div>
  </aside>

  <div class="map-area">
    <div id="map"></div>
    <div class="popup-card" id="popup">
      <button class="close" id="closePopup">&times;</button>
      <div class="ptype" id="pType"></div>
      <div class="pname" id="pName"></div>
      <div class="pregion" id="pRegion"></div>
      <div class="paddress" id="pAddress"></div>
      <div class="pbtns">
        <button class="secondary" id="setFrom">Отсюда</button>
        <button class="secondary" id="setTo">Сюда</button>
        <a class="btn primary" id="site" href="#" target="_blank" rel="noopener">Сайт ↗</a>
      </div>
    </div>
  </div>
</div>

districts.filter(d=>d.reg==='АК').forEach(d=>{
  const lbl=document.createElement('label');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.dn=d.n;
  cb.onchange=function(){
    const p=distPolygons[d.n];
    if(this.checked)distLayer.addLayer(p);else distLayer.removeLayer(p);
  };
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(' '+d.n));
  dList.appendChild(lbl);
});

// === MARKERS ===
function pinColor(p){
  if(p.t==='project')return p.r==='Алтайский край'?'#7aa34a':'#2d8cb2';
  return{airport:'#263c4b',casino:'#7e4b84',place:'#d17a36',hotel:'#b8860b'}[p.t]||'#666';
}
function typeLabel(p){
  return{project:'Проект',airport:'Аэропорт',casino:'Казино',hotel:'Отель',place:'Важное место'}[p.t];
}
function layerId(p){
  return{project:'chk_projects',airport:'chk_airports',casino:'chk_casino',hotel:'chk_hotels',place:'chk_places'}[p.t];
}
function mkIcon(color,sz){
  return L.divIcon({className:'',html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .15s"></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
}

const layers={};
const hiddenObj=new Set();
const allMarkers=[];

points.forEach(p=>{
  const sz=p.t==='airport'?14:18;
  const m=L.marker([p.lat,p.lon],{icon:mkIcon(pinColor(p),sz)});
  const cls=p.t==='airport'?'lbl-airport':'lbl-project';
  m.bindTooltip(p.n,{permanent:true,direction:p.ld||'right',offset:p.lo||[sz/2+4,0],className:cls});
  m.on('click',()=>openPopup(p));
  m._pd=p;
  allMarkers.push(m);
  const lid=layerId(p);
  if(!layers[lid])layers[lid]=L.layerGroup();
  layers[lid].addLayer(m);
});
// Object.values(layers).forEach(g=>g.addTo(map)); // объекты временно скрыты

// River labels
const riverLayer=L.layerGroup().addTo(map);
rivers.forEach(r=>{
  const m=L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',html:'',iconSize:[0,0]})});
  m.bindTooltip(r.n,{permanent:true,direction:'center',className:'lbl-river'});
  riverLayer.addLayer(m);
});

  {n:'Барнаул',lat:53.3548,lon:83.7696,capital:true},
  {n:'Бийск',lat:52.5394,lon:85.2139,capital:false},
  {n:'Славгород',lat:52.9986,lon:78.6459,capital:false},
  {n:'Камень-на-Оби',lat:53.7914,lon:81.3545,capital:false},
  {n:'Алейск',lat:52.4922,lon:82.7794,capital:false},
  {n:'Рубцовск',lat:51.5012,lon:81.2089,capital:false},
  {n:'Горно-Алтайск',lat:51.9581,lon:85.9603,capital:true},
  {n:'Чемал',lat:51.4026,lon:86.0011,capital:false},
  {n:'Усть-Кокса',lat:50.2681,lon:85.6146,capital:false},
  {n:'Усть-Улаган',lat:50.9324,lon:87.9966,capital:false},
  {n:'Кош-Агач',lat:50.0137,lon:88.6673,capital:false},
  {n:'Телецкое озеро',lat:51.7500,lon:87.6800,lake:true}
];
const cityLayer=L.layerGroup().addTo(map);
cities.forEach(c=>{
  if(c.lake){
    const m=L.marker([c.lat,c.lon],{icon:L.divIcon({className:'',html:'',iconSize:[0,0]})});
    m.bindTooltip(c.n,{permanent:true,direction:'right',className:'lbl-river',offset:[8,0]});
    cityLayer.addLayer(m);
    return;
  }
  const sz=c.capital?10:7;
  const border=c.capital?3:2;
  const icon=L.divIcon({
    className:'',
    html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:#fff;border:'+border+'px solid #333;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>',
    iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]
  });
  const m=L.marker([c.lat,c.lon],{icon:icon});
  const fsz=c.capital?'14px':'11px';
  const fw=c.capital?'800':'600';
  m.bindTooltip(c.n,{permanent:true,direction:'right',offset:[8,0],className:'lbl-city'});
  m.getTooltip().options.className=c.capital?'lbl-city-cap':'lbl-city';
  cityLayer.addLayer(m);
});

// === LAYER CHECKBOXES ===
['chk_projects','chk_airports','chk_casino','chk_places','chk_hotels'].forEach(id=>{
  document.getElementById(id).onchange=function(){
    const lg=layers[id];if(!lg)return;
    if(this.checked)map.addLayer(lg);else map.removeLayer(lg);
  };
});
document.getElementById('chk_kra').onchange=function(){if(this.checked)map.addLayer(kraLayer);else map.removeLayer(kraLayer)};
document.getElementById('chk_rep').onchange=function(){if(this.checked)map.addLayer(repLayer);else map.removeLayer(repLayer)};
distLayer.addTo(map);

// === INDIVIDUAL OBJECT CHECKBOXES ===
const objList=document.getElementById('objList');
const nonAirports=points.filter(p=>p.t!=='airport');
nonAirports.forEach(p=>{
  const lbl=document.createElement('label');
  const cb=document.createElement('input');
  cb.type='checkbox';cb.checked=true;cb.dataset.name=p.n;
  cb.onchange=function(){
    if(this.checked){hiddenObj.delete(p.n);showMarker(p)}
    else{hiddenObj.add(p.n);hideMarker(p)}
  };
  lbl.appendChild(cb);
  const dot=document.createElement('span');
  dot.className='sw';dot.style.background=pinColor(p);dot.style.flexShrink='0';
  lbl.appendChild(dot);
  lbl.appendChild(document.createTextNode(' '+p.n));
  objList.appendChild(lbl);
});

function findMarker(p){return allMarkers.find(m=>m._pd===p)}
function hideMarker(p){
  const m=findMarker(p);if(!m)return;
  const lg=layers[layerId(p)];if(lg&&lg.hasLayer(m))lg.removeLayer(m);
}
function showMarker(p){
  const m=findMarker(p);if(!m)return;
  const lg=layers[layerId(p)];
  if(lg&&!lg.hasLayer(m)&&document.getElementById(layerId(p)).checked)lg.addLayer(m);
}

let allOn=true;
document.getElementById('toggleAll').onclick=function(){
  allOn=!allOn;
  this.textContent=allOn?'Убрать все':'Выбрать все';
  objList.querySelectorAll('input').forEach(cb=>{
    cb.checked=allOn;
    const p=nonAirports.find(x=>x.n===cb.dataset.name);
    if(allOn){hiddenObj.delete(cb.dataset.name);if(p)showMarker(p)}
    else{hiddenObj.add(cb.dataset.name);if(p)hideMarker(p)}
  });
};

// === POPUP ===
function openPopup(p){
  document.getElementById('pType').textContent=typeLabel(p);
  document.getElementById('pName').textContent=p.n;
  document.getElementById('pRegion').textContent=p.r;
  document.getElementById('pAddress').textContent=p.addr||'';
  const site=document.getElementById('site');
  if(p.url){site.style.display='inline-block';site.href=p.url}else site.style.display='none';
  document.getElementById('setFrom').onclick=()=>{from.value=p.n;updateYandex()};
  document.getElementById('setTo').onclick=()=>{to.value=p.n;updateYandex()};
  document.getElementById('popup').classList.add('open');
}
document.getElementById('closePopup').onclick=()=>document.getElementById('popup').classList.remove('open');

// === ROUTING ===
const from=document.getElementById('from'),to=document.getElementById('to');
(function fill(){
  const opts=points.map(p=>`<option value="${p.n}">${p.n}</option>`).join('');
  from.innerHTML=opts;to.innerHTML=opts;
  from.value='Аэропорт Горно-Алтайск';to.value='Бирюзовая Катунь';
})();
function gp(n){return points.find(p=>p.n===n)}
function updateYandex(){
  const a=gp(from.value),b=gp(to.value);
  if(a&&b)document.getElementById('yandex').href=`https://yandex.ru/maps/?rtext=${a.lat},${a.lon}~${b.lat},${b.lon}&rtt=auto`;
}
from.onchange=updateYandex;to.onchange=updateYandex;updateYandex();

let routeLine=null;
async function buildRoute(){
  const a=gp(from.value),b=gp(to.value);
  if(!a||!b||a.n===b.n){document.getElementById('result').textContent='Выберите две разные точки';return}
  updateYandex();
  document.getElementById('result').innerHTML='<i>Строю маршрут…</i>';
  if(routeLine){map.removeLayer(routeLine);routeLine=null}
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`);
    const d=await r.json();
    if(d.code==='Ok'&&d.routes.length){
      const rt=d.routes[0];
      const km=(rt.distance/1000).toFixed(1);
      const min=Math.round(rt.duration/60);
      const h=Math.floor(min/60),m=min%60;
      document.getElementById('result').innerHTML=`<b>${a.n}</b> → <b>${b.n}</b><br>🚗 ${km} км по дороге<br>⏱ ${h>0?h+' ч ':''}${m} мин`;
      routeLine=L.polyline(rt.geometry.coordinates.map(c=>[c[1],c[0]]),{color:'#123746',weight:5,opacity:0.7}).addTo(map);
      map.fitBounds(routeLine.getBounds().pad(0.15));
    }else fallback(a,b);
  }catch(e){fallback(a,b)}
}
function fallback(a,b){
  document.getElementById('result').innerHTML=`Маршрут недоступен — откройте в Яндекс Картах`;
  routeLine=L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:'#123746',weight:2,dashArray:'8 6',opacity:0.4}).addTo(map);
}
document.getElementById('buildRoute').onclick=buildRoute;
document.getElementById('clearRoute').onclick=()=>{
  if(routeLine){map.removeLayer(routeLine);routeLine=null}
  document.getElementById('result').textContent='';
};

// River label visibility by zoom
map.on('zoomend',()=>{
  const z=map.getZoom();
  riverLayer.eachLayer(m=>{
    const el=m.getTooltip()?.getElement();
    if(el)el.style.opacity=z>=7?'1':'0';
  });
});
map.fire('zoomend');
